; PHP settings for the Docker images.
expose_php = Off
memory_limit = 512M
upload_max_filesize = 10M
post_max_size = 10M
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code is baked into the image; rebuild the image after code changes.
opcache.validate_timestamps = 0
