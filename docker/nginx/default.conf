# API only: every request goes to Laravel's front controller in the app container.
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    client_max_body_size 10m;

    # Docker's DNS; look "app" up per request so nginx starts (and recovers)
    # even when the app container is not resolvable yet or was recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app:9000;

    location / {
        include fastcgi_params;
        fastcgi_pass $app_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }
}
