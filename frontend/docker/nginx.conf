# Serves the built React app and forwards /api/... to the Laravel stack.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Docker's DNS; look "web" up per request so nginx starts even if it is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://web:80;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/products/7, /users, ...) all load index.html.
    location / {
        try_files $uri /index.html;
    }
}
