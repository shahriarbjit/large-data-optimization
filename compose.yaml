# urban-nest-api in Docker.
#
#   docker compose up -d --build        start (first start migrates and seeds; see README)
#   docker compose logs -f app          follow the app log
#   docker compose down                 stop (data is kept)
#   docker compose down -v              stop and delete all data
#   docker compose --profile test run --rm --build test    run `composer ci` in Docker
#   docker compose up -d elasticsearch kibana               only Elasticsearch + Kibana
#
# Optional overrides (shell or a .env file next to this one): DOCKER_HTTP_PORT,
# DOCKER_DB_PORT, DOCKER_DB_PASSWORD, DOCKER_SEED_BULK_USERS, DOCKER_SEED_PRODUCTS,
# ELASTIC_VERSION, DOCKER_ES_HEAP, DOCKER_ES_PORT, DOCKER_KIBANA_PORT.

name: urban-nest-api

x-app-env: &app-env
  APP_NAME: urban-nest-api
  APP_ENV: local
  APP_DEBUG: "false"
  APP_URL: http://localhost:${DOCKER_HTTP_PORT:-8080}
  LOG_CHANNEL: stderr
  LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: urban_nest_api
  DB_USERNAME: root
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
  SESSION_DRIVER: array
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  SANCTUM_EXPIRATION: "10080"
  SEED_BULK_USERS: ${DOCKER_SEED_BULK_USERS:-1000000}
  SEED_PRODUCTS: ${DOCKER_SEED_PRODUCTS:-10000000}
  ELASTICSEARCH_HOST: http://elasticsearch:9200

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      MYSQL_DATABASE: urban_nest_api
    ports:
      # 3307 on the host, so it does not clash with a local MySQL on 3306.
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      target: app
    image: urban-nest-api:latest
    environment: *app-env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy once the entrypoint finished (migrate + seed) and PHP-FPM listens.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 10
      # First start seeds 1M users and 10M products (can take 20+ minutes).
      start_period: 60m

  web:
    image: nginx:1.27-alpine
    ports:
      - "${DOCKER_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  # Elasticsearch for local search practice. Security is OFF: never expose
  # this port to a network. Bound to 127.0.0.1 so only this PC can reach it.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.1.5}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms${DOCKER_ES_HEAP:-1g} -Xmx${DOCKER_ES_HEAP:-1g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:${DOCKER_ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # Kibana: web console (Dev Tools) for Elasticsearch, http://localhost:5601
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.1.5}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:${DOCKER_KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # docker compose --profile test run --rm --build test
  test:
    profiles: [test]
    build:
      context: .
      target: dev
    environment:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_HOST: db
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      PAO_DISABLE: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage:
  es-data:
